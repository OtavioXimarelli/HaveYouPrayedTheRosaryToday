# Coolify/Nixpacks build plan
# Nixpacks' default template installs corepack@0.24.1, which cannot launch
# pnpm 11 on Node 22 (ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING). Install the
# exact pnpm pinned in package.json directly instead.

[phases.install]
cmds = [
  "npm i -g pnpm@11.22.0",
  "pnpm i --frozen-lockfile"
]
