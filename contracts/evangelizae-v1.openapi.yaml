openapi: 3.1.0
info:
  title: Evangelizae API
  version: 1.0.0-cycle1
  description: >
    Contract mirror for the separately maintained Spring API (Java 25 / Spring Boot 4 / MongoDB 7+).
    The backend repository is canonical. This file expands the beta contract with Cycle 1 — Accounts & Sync
    (auth, users, prayer sync, spiritual plans) per BACKEND_LAUNCH_CHECKLIST.md. Community / formation / AI remain stubs.
servers:
  - url: http://localhost:8080/api/v1
security: []
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Liveness probe (also exposed as GET /api/health in Docker)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: UP}
  # ── Auth ──
  /auth/register:
    post:
      operationId: authRegister
      summary: Register a new user (email + password)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '400': {$ref: '#/components/responses/ApiError'}
        '409':
          description: Email already taken
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /auth/login:
    post:
      operationId: authLogin
      summary: Login with email/password, returns JWT pair
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '400': {$ref: '#/components/responses/ApiError'}
        '401': {$ref: '#/components/responses/ApiError'}
        '429': {$ref: '#/components/responses/ApiError'}
  /auth/refresh:
    post:
      operationId: authRefresh
      summary: Rotate refresh token, issue new JWT pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '401': {$ref: '#/components/responses/ApiError'}
  /auth/logout:
    post:
      operationId: authLogout
      summary: Invalidate refresh token (requires Bearer)
      security: [{bearerAuth: []}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: {type: string}
      responses:
        '204': {description: Logged out}
        '401': {$ref: '#/components/responses/ApiError'}
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Request password-reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        '204': {description: 'If email exists, reset email sent (always 204)'}
        '400': {$ref: '#/components/responses/ApiError'}
  /auth/reset-password:
    post:
      operationId: resetPassword
      summary: Reset password with single-use token (1h)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: {type: string}
                newPassword: {type: string, minLength: 8}
      responses:
        '204': {description: Password updated}
        '400': {$ref: '#/components/responses/ApiError'}
  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Verify email with 24h token/code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
      responses:
        '204': {description: Email verified}
        '400': {$ref: '#/components/responses/ApiError'}
  # ── Users ──
  /users/me:
    get:
      operationId: getCurrentUser
      summary: Get authenticated user profile + stats
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/ApiError'}
    patch:
      operationId: updateCurrentUser
      summary: Update name, locale, preferences
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateUserRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/ApiError'}
        '401': {$ref: '#/components/responses/ApiError'}
    delete:
      operationId: deleteCurrentUser
      summary: LGPD hard delete — user + completions + plans + subscriptions
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/ApiError'}
  /users/me/export:
    get:
      operationId: exportCurrentUser
      summary: Export JSON (user + completions + plans + preferences) — LGPD
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: {$ref: '#/components/schemas/User'}
                  completions: {type: array, items: {$ref: '#/components/schemas/PrayerCompletion'}}
                  spiritualPlan: {$ref: '#/components/schemas/SpiritualPlan'}
        '401': {$ref: '#/components/responses/ApiError'}
  /users/me/migrate:
    post:
      operationId: migrateGuestData
      summary: Merge anonymous localStorage export into authenticated account (idempotent)
      security: [{bearerAuth: []}]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MigrateRequest'}
      responses:
        '200':
          description: Merged
          content:
            application/json:
              schema:
                type: object
                properties:
                  stats: {$ref: '#/components/schemas/PrayerStats'}
                  migratedCount: {type: integer}
        '400': {$ref: '#/components/responses/ApiError'}
        '401': {$ref: '#/components/responses/ApiError'}
        '409': {$ref: '#/components/responses/ApiError'}
  /users/me/state:
    get:
      operationId: getSyncState
      summary: Pull sync state for offline-first reconciliation (ETag)
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: {$ref: '#/components/schemas/User'}
                  stats: {$ref: '#/components/schemas/PrayerStats'}
                  recentCompletions: {type: array, items: {$ref: '#/components/schemas/PrayerCompletion'}}
                  preferences: {$ref: '#/components/schemas/UserPreferences'}
        '401': {$ref: '#/components/responses/ApiError'}
  # ── Prayer (synced) ──
  /prayer/checkin:
    post:
      operationId: prayerCheckIn
      summary: Idempotent rosary check-in — one per localDate (requires Idempotency-Key)
      security: [{bearerAuth: []}]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PrayerCheckInRequest'}
      responses:
        '200':
          description: Recorded (or replayed if same Idempotency-Key)
          content:
            application/json:
              schema:
                type: object
                properties:
                  completion: {$ref: '#/components/schemas/PrayerCompletion'}
                  stats: {$ref: '#/components/schemas/PrayerStats'}
        '400': {$ref: '#/components/responses/ApiError'}
        '401': {$ref: '#/components/responses/ApiError'}
        '409':
          description: Already checked in today or Idempotency-Key replay conflict
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '429': {$ref: '#/components/responses/ApiError'}
  /prayer/history:
    get:
      operationId: prayerHistory
      summary: Paginated completion history (for WeekDots)
      security: [{bearerAuth: []}]
      parameters:
        - name: from
          in: query
          schema: {type: string, format: date}
        - name: to
          in: query
          schema: {type: string, format: date}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 90, default: 7}
        - name: cursor
          in: query
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/PrayerCompletion'}}
                  nextCursor: {anyOf: [{type: string}, {type: 'null'}]}
        '400': {$ref: '#/components/responses/ApiError'}
        '401': {$ref: '#/components/responses/ApiError'}
  /prayer/stats:
    get:
      operationId: prayerStats
      summary: Consecutive days, total, last date, completedToday — server-side getPrayerStats
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PrayerStats'}
        '401': {$ref: '#/components/responses/ApiError'}
  # ── Spiritual Plans ──
  /spiritual-plans:
    post:
      operationId: createSpiritualPlan
      summary: Create 30-day spiritual plan (one active per user)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSpiritualPlanRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpiritualPlan'}
        '400': {$ref: '#/components/responses/ApiError'}
        '401': {$ref: '#/components/responses/ApiError'}
        '409': {$ref: '#/components/responses/ApiError'}
  /spiritual-plans/current:
    get:
      operationId: getCurrentSpiritualPlan
      summary: Get active spiritual plan + derived progress
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpiritualPlan'}
        '401': {$ref: '#/components/responses/ApiError'}
        '404': {$ref: '#/components/responses/ApiError'}
    patch:
      operationId: updateSpiritualPlan
      summary: Update status (abandoned|completed) — daysCompleted is derived, not writable
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: {type: string, enum: [active, completed, abandoned]}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpiritualPlan'}
        '400': {$ref: '#/components/responses/ApiError'}
        '401': {$ref: '#/components/responses/ApiError'}
  # ── Liturgy (existing, unchanged contract) ──
  /liturgy/today:
    get:
      operationId: getDailyLiturgy
      summary: Return the Catholic liturgy for the current date in the requested timezone.
      parameters:
        - name: timezone
          in: query
          required: true
          schema: {type: string, example: America/Sao_Paulo}
        - name: locale
          in: query
          required: true
          schema: {type: string, enum: [pt-BR]}
      responses:
        '200':
          description: Daily liturgy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DailyLiturgy'}
        '503':
          description: Neither the provider nor a same-date cache is available.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ApiError:
      description: Standard error (TECHNICAL_SKELETON 6 Rule 5)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 8, maxLength: 128}
        fullName: {type: string, minLength: 1, maxLength: 80}
        preferredLocale: {type: string, enum: [pt-BR], default: pt-BR}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string}
    AuthResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken: {type: string}
        refreshToken: {type: string}
        expiresIn: {type: integer, example: 900}
        tokenType: {type: string, example: Bearer}
        user: {$ref: '#/components/schemas/User'}
    User:
      type: object
      required: [id, email, fullName, preferredLocale, roles, preferences, createdAt]
      properties:
        id: {type: string}
        email: {type: string, format: email}
        emailVerified: {type: boolean}
        fullName: {anyOf: [{type: string}, {type: 'null'}]}
        preferredLocale: {type: string, enum: [pt-BR]}
        roles: {type: array, items: {type: string, enum: [ROLE_USER, ROLE_MODERATOR, ROLE_ADMIN]}}
        preferences: {$ref: '#/components/schemas/UserPreferences'}
        spiritualPlan: {anyOf: [{$ref: '#/components/schemas/SpiritualPlan'}, {type: 'null'}]}
        stats: {$ref: '#/components/schemas/PrayerStats'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    UserPreferences:
      type: object
      properties:
        readerSize: {type: string, enum: [normal, large, xl], default: normal}
        theme: {type: string, enum: [system, light, dark], default: system}
        prayerWindow: {anyOf: [{type: string, enum: [morning, afternoon, evening]}, {type: 'null'}]}
        reminderTime: {anyOf: [{type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$'}, {type: 'null'}], example: '08:00'}
    UpdateUserRequest:
      type: object
      properties:
        fullName: {anyOf: [{type: string, minLength: 1, maxLength: 80}, {type: 'null'}]}
        preferredLocale: {type: string, enum: [pt-BR]}
        preferences: {$ref: '#/components/schemas/UserPreferences'}
    MigrateRequest:
      type: object
      description: Mirrors frontend export shape (Settings > Export) plus version
      properties:
        version: {type: integer, example: 2}
        prayerState: {type: object}
        preferences: {$ref: '#/components/schemas/UserPreferences'}
        completions: {type: array, items: {$ref: '#/components/schemas/PrayerCompletion'}}
    PrayerCheckInRequest:
      type: object
      required: [mysteryType]
      properties:
        mysteryType: {type: string, enum: [gozosos, luminosos, dolorosos, gloriosos], description: 'Must match getDailyMysteryType() for localDate if provided'}
        prayedBeadsCount: {type: integer, minimum: 50, default: 50}
        intentions: {type: array, maxItems: 5, items: {type: string, minLength: 1, maxLength: 140}}
        reflection: {type: string, maxLength: 2000}
        localDate: {type: string, format: date, description: 'Optional override; defaults to America/Sao_Paulo today'}
        timeZone: {type: string, example: America/Sao_Paulo}
    PrayerCompletion:
      type: object
      required: [id, localDate, completedAt, timeZone, mysteryType]
      properties:
        id: {type: string, example: rosary-1724899200000}
        localDate: {type: string, format: date, example: '2026-08-28'}
        completedAt: {type: string, format: date-time}
        timeZone: {type: string, example: America/Sao_Paulo}
        mysteryType: {type: string, enum: [gozosos, luminosos, dolorosos, gloriosos]}
        intentions: {type: array, items: {type: string}}
        reflection: {anyOf: [{type: string}, {type: 'null'}]}
    PrayerStats:
      type: object
      required: [consecutiveDays, totalRosariesPrayed, lastCompletionDate, completedToday]
      description: Server-side getPrayerStats() — mirrors src/store/usePrayerStore.ts:55
      properties:
        consecutiveDays: {type: integer, minimum: 0}
        totalRosariesPrayed: {type: integer, minimum: 0}
        lastCompletionDate: {anyOf: [{type: string, format: date}, {type: 'null'}]}
        completedToday: {type: boolean}
    CreateSpiritualPlanRequest:
      type: object
      required: [goal]
      properties:
        goal: {type: string, enum: [HABIT_FORMATION, DEEPEN_FAITH, RETURN_TO_CHURCH], default: HABIT_FORMATION}
        durationDays: {type: integer, enum: [30], default: 30}
    SpiritualPlan:
      type: object
      required: [id, userId, goal, startDate, endDate, status]
      properties:
        id: {type: string}
        userId: {type: string}
        goal: {type: string, enum: [HABIT_FORMATION, DEEPEN_FAITH, RETURN_TO_CHURCH]}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date}
        status: {type: string, enum: [active, completed, abandoned]}
        daysCompleted: {type: integer, minimum: 0, maximum: 30, description: 'Derived from prayer_completions within plan window'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    DailyLiturgy:
      type: object
      required: [date, title, color, prayers, groups, source]
      properties:
        date: {type: string, format: date}
        title: {type: string}
        color: {type: string, enum: [GREEN, WHITE, RED, PURPLE, ROSE]}
        prayers:
          type: object
          properties:
            collect: {type: string}
            offerings: {type: string}
            communion: {type: string}
        groups:
          type: array
          items:
            type: object
            required: [kind, items]
            properties:
              kind: {type: string, enum: [FIRST_READING, PSALM, SECOND_READING, GOSPEL, EXTRA]}
              items:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [title, text]
                  properties:
                    title: {type: string}
                    reference: {type: string}
                    text: {type: string}
                    refrain: {type: string}
        source:
          type: object
          required: [provider, fetchedAt, freshness]
          properties:
            provider: {type: string}
            fetchedAt: {type: string, format: date-time}
            freshness: {type: string, enum: [LIVE, CACHED]}
    ApiError:
      type: object
      required: [timestamp, status, error, code, message, path]
      properties:
        timestamp: {type: string, format: date-time}
        status: {type: integer}
        error: {type: string}
        code: {type: string, example: LITURGY_UNAVAILABLE}
        message: {type: string}
        path: {type: string}
